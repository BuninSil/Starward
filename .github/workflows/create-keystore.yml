name: Create signing keystore (one-time)

# Run ONCE, manually (Actions -> "Create signing keystore (one-time)" -> Run workflow).
# Generates the permanent release keystore and stores it as the ANDROID_KEYSTORE_BASE64
# secret. Refuses to run if that secret already exists, so an existing key is never replaced.
# Full instructions: docs/KEYSTORE.md

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Напиши CREATE, чтобы создать ключ'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-24.04
    steps:
      - name: Check inputs and prerequisites
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CREATE" ]; then
            echo "::error::Type CREATE in the 'confirm' field to run this workflow."; exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret SECRETS_ADMIN_TOKEN is missing (fine-grained token with Secrets: read and write). See docs/KEYSTORE.md"; exit 1
          fi
          if [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Create secrets ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS first. See docs/KEYSTORE.md"; exit 1
          fi
          if [ ${#KS_PASS} -lt 12 ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD must be at least 12 characters."; exit 1
          fi
          existing=$(gh secret list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')
          if echo "$existing" | grep -qx "ANDROID_KEYSTORE_BASE64"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 already exists. Refusing to replace the signing key (updates would stop installing)."; exit 1
          fi

      - name: Generate keystore and store it as a secret
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -v -keystore "$ks" -storetype PKCS12 \
            -alias "$KS_ALIAS" -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Starward, O=BuninSil" > /dev/null 2>&1
          base64 -w0 "$ks" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          keytool -list -v -keystore "$ks" -storepass "$KS_PASS" | grep -E "Alias name|SHA256:|Valid"
          # Encrypted backup (AES-256, same password) — download it and keep it safe.
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$ks" -out "$RUNNER_TEMP/release.keystore.enc" -pass env:KS_PASS
          shred -u "$ks"
          echo "Keystore created and saved to secret ANDROID_KEYSTORE_BASE64."

      - name: Upload encrypted keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          path: ${{ runner.temp }}/release.keystore.enc
          retention-days: 7
